<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 64" width="328" height="64" role="img" aria-label="RedstonePanel">
  <!-- RedstonePanel logo (for dark backgrounds): the circuit "R" icon and the wordmark.
       Original artwork for RedstonePanel (MIT). The wordmark uses the system UI font. -->
  <svg x="0" y="0" width="64" height="64" viewBox="0 0 32 32">
    <defs>
      <linearGradient id="rp-stone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2d2a28"/>
        <stop offset="1" stop-color="#161413"/>
      </linearGradient>
      <filter id="rp-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>
    </defs>
    <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="url(#rp-stone)" stroke="#4a4542"/>
    <!-- stone speckle -->
    <g fill="#fff" opacity="0.05">
      <rect x="4" y="4" width="2" height="2"/><rect x="25" y="5" width="2" height="2"/>
      <rect x="26" y="13" width="2" height="2"/><rect x="4" y="18" width="2" height="2"/>
      <rect x="13" y="26" width="2" height="2"/>
    </g>
    <!-- glow -->
    <g fill="none" stroke="#ff2a1a" stroke-width="5" stroke-linecap="square" opacity="0.75" filter="url(#rp-glow)">
      <path d="M10 24V9H21V16H12M17 16V20H21V24"/>
    </g>
    <!-- trace -->
    <g fill="none" stroke="#ff3b2f" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M10 24V9H21V16H12M17 16V20H21V24"/>
    </g>
    <!-- lit core -->
    <g fill="none" stroke="#ffc9bf" stroke-width="1.1" stroke-linecap="square" opacity="0.9">
      <path d="M10 24V9H21V16H12M17 16V20H21V24"/>
    </g>
    <!-- powered ends -->
    <g fill="#fff3ef">
      <rect x="8.75" y="22.75" width="2.5" height="2.5"/>
      <rect x="19.75" y="22.75" width="2.5" height="2.5"/>
    </g>
  </svg>
  <text x="78" y="43" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.5"><tspan fill="#ff4b3a">Redstone</tspan><tspan fill="#ecebe9">Panel</tspan></text>
</svg>
