<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedstonePanel Sign In</title>
    <link rel="icon" href="/static/img/redstonepanel-icon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/img/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1b1a19">
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <script>
        // Same theme preferences as the dashboard
        try {
            if ((localStorage.getItem('rp_themeMode') || 'dark') === 'dark') document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', localStorage.getItem('rp_themeColor') || 'redstone');
        } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-200 font-sans antialiased p-4">
    <form id="login-form" class="w-full max-w-sm bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl overflow-hidden">
        <div class="rp-signal" aria-hidden="true"></div>
        <div class="p-6">
        <h1 class="flex items-center gap-3 text-2xl font-extrabold tracking-tight mb-3">
            <img src="/static/img/redstonepanel-icon.svg" alt="" class="w-11 h-11 shrink-0">
            <span><span class="text-redstone-600 dark:text-redstone-400">Redstone</span><span class="text-gray-900 dark:text-gray-100">Panel</span></span>
        </h1>
        <p id="panel-name" class="hidden text-lg font-bold text-gray-700 dark:text-gray-300 mb-1 truncate"></p>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Sign in with your server (Linux) account or a RedstonePanel account.</p>

        <label for="username" class="block text-sm font-bold mb-1">Username</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required
               class="w-full mb-4 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded p-2 text-gray-900 dark:text-white">

        <label for="password" class="block text-sm font-bold mb-1">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full mb-4 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded p-2 text-gray-900 dark:text-white">

        <p id="login-error" class="hidden text-sm text-red-500 mb-4" role="alert"></p>

        <button id="login-btn" type="submit" class="w-full bg-theme hover-bg-theme text-white py-2 rounded font-bold transition disabled:opacity-60">Sign In</button>
        </div>
    </form>

    <script>
        // Show which server's panel this is before anyone types a password
        fetch('/api/panel-info').then(r => r.ok ? r.json() : null).then(info => {
            if (!info || !info.name) return;
            const el = document.getElementById('panel-name');
            el.innerText = info.name;
            el.title = info.name;
            el.classList.remove('hidden');
            document.title = `${info.name} · RedstonePanel Sign In`;
        }).catch(() => {});

        // Already signed in? Go straight to the dashboard. (On a trusted LAN /me also answers,
        // but then the visitor came here on purpose to sign in, so stay.)
        fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(u => {
            if (u && u.source !== 'trusted') location.replace('/static/index.html');
            if (u && u.source === 'trusted') {
                const back = document.createElement('a');
                back.href = '/static/index.html';
                back.className = 'block text-center text-sm mt-4 underline text-gray-500 dark:text-gray-400';
                back.innerText = 'Continue without signing in';
                document.querySelector('#login-form > .p-6').appendChild(back);
            }
        }).catch(() => {});

        document.getElementById('login-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            err.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = 'Signing in...';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                if (res.ok) {
                    location.replace('/static/index.html');
                    return;
                }
                let detail = `Sign-in failed (HTTP ${res.status}).`;
                try { detail = (await res.json()).detail || detail; } catch (e) {}
                err.innerText = detail;
            } catch (e) {
                err.innerText = 'Could not reach the panel.';
            }
            err.classList.remove('hidden');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
            btn.disabled = false;
            btn.innerText = 'Sign In';
        });
    </script>
</body>
</html>
