# Installed by RedstonePanel for its game servers (minecraft-*.service).
# Java exits with 143 when systemd stops it with SIGTERM: that's a clean stop, not a failure.
# The hooks run as root ("+") and their failures are ignored ("-"); they send the panel's
# webhook notifications (started, stopped, crashed) even while the panel itself is down.
[Service]
SuccessExitStatus=143
ExecStartPost=-+/usr/sbin/redstonepanel notify-unit start %N
ExecStopPost=-+/usr/sbin/redstonepanel notify-unit stop %N
