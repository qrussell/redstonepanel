# Installed by RedstonePanel (1.21.9). Ubuntu's needrestart restarts services that still use
# an old copy of a library after apt upgrades something. For a Minecraft server that means
# every player is dropped mid-game, so it is told to leave game servers and their Bedrock
# proxies (Phantom) alone. They pick up the new libraries at their next restart (a scheduled
# restart, or Restart in the panel). The panel's own service may still be restarted: that
# only reloads the web page.
$nrconf{override_rc}{qr(^minecraft[\w.@-]*\.service$)} = 0;
$nrconf{override_rc}{qr(^phantom-minecraft[\w.@-]*\.service$)} = 0;
