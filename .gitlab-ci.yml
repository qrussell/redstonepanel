# Checks and a .deb build for merge requests, main and tags; a GitLab release for tags.
# Having this file also turns off GitLab Auto DevOps for the project (its generic
# build/test/code_quality jobs don't apply to this repo).
#
# Releases happen in two places from the same tag:
# - GitLab (here): build-deb builds the .deb in ubuntu:24.04, and release uploads it to
#   the package registry and creates the GitLab release (packaging/gitlab-release.py).
# - GitHub: GitLab mirrors the tag, and .github/workflows/release.yml builds the .deb,
#   install-tests it on Ubuntu 24.04 and 25.04 and creates the GitHub release, which
#   qrussell-repo (apt) picks up.
# release-from-github recreates a GitLab release from the GitHub one: run a pipeline on
# main with the variable RELEASE_TAG=vX.Y.Z (Build > Pipelines > Run pipeline).

workflow:
  rules:
    # A pipeline run by hand with RELEASE_TAG set (see release-from-github)
    - if: $RELEASE_TAG && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")
    # Merge request pipelines, and branch pipelines only for main (no duplicates
    # when a branch has an open merge request)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.12-slim
  interruptible: true

stages:
  - check
  - build
  - release

python:
  stage: check
  script:
    - python -m py_compile main.py run.py https_redirect.py core/*.py tests/*.py packaging/*.py packaging/screenshots/*.py
    # fastapi lets tests/test_cluster.py check every API route against the node-token allowlist
    - pip install --quiet --disable-pip-version-check fastapi python-multipart httpx
    - python -m unittest discover -s tests -v

version:
  stage: check
  script:
    # The man page must name the debian/changelog version; a tag must match it too
    - VERSION=$(head -1 debian/changelog | sed -E 's/.*\(([^)]+)\).*/\1/')
    - grep -q "\"redstonepanel $VERSION\"" packaging/redstonepanel.8 || { echo "packaging/redstonepanel.8 is not at $VERSION"; exit 1; }
    - if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then echo "tag $CI_COMMIT_TAG != v$VERSION"; exit 1; fi
    # The GitHub release uses release-notes/v<version>.md as its description
    - if [ ! -s "release-notes/v$VERSION.md" ]; then echo "WARNING - no release-notes/v$VERSION.md; the GitHub release would get generated notes only"; fi
    - echo "version $VERSION"

package:
  stage: check
  script:
    # Every core module must be installed by the package
    - for f in core/*.py; do grep -q "$f" debian/redstonepanel.install || { echo "$f missing from debian/redstonepanel.install"; exit 1; }; done
    # Shell scripts must parse and keep LF line endings (CRLF breaks them on Linux)
    - for f in packaging/*.sh packaging/test/*.sh packaging/screenshots/*.sh deploy/*.sh packaging/redstonepanel; do bash -n "$f" || exit 1; done
    - sh -n install.sh
    - if grep -l $'\r' install.sh packaging/*.sh packaging/test/*.sh packaging/screenshots/*.sh deploy/*.sh packaging/redstonepanel debian/*; then echo "CRLF line endings found"; exit 1; fi
    - echo "package files OK"

workflows:
  stage: check
  script:
    # GitHub Actions workflows must be valid YAML with jobs
    - pip install --quiet --disable-pip-version-check pyyaml
    - |
      python - <<'EOF'
      import glob, yaml
      for path in sorted(glob.glob(".github/workflows/*.yml")):
          data = yaml.safe_load(open(path, encoding="utf-8"))
          assert isinstance(data, dict) and data.get("jobs"), f"{path}: no jobs"
          print(f"ok {path}: {', '.join(data['jobs'])}")
      EOF

build-deb:
  stage: build
  image: ubuntu:24.04
  needs: []
  rules:
    - if: $RELEASE_TAG
      when: never
    - when: on_success
  script:
    - set -o pipefail
    # packaging/build-deb.sh reads the sources from /src and writes the .deb to /out
    - ln -s "$CI_PROJECT_DIR" /src
    - mkdir -p dist && ln -s "$CI_PROJECT_DIR/dist" /out
    - bash packaging/build-deb.sh | tee build.log
    # lintian runs inside the build; fail on errors or warnings (as the GitHub build does)
    - |
      if grep -E '^[EW]: ' build.log; then echo "lintian reported problems"; exit 1; fi
  artifacts:
    name: redstonepanel-$CI_COMMIT_REF_SLUG
    paths:
      - dist/*.deb
    expire_in: 30 days

release:
  stage: release
  image: python:3.12-slim
  interruptible: false
  resource_group: release
  dependencies: [build-deb]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - python3 packaging/gitlab-release.py "$CI_COMMIT_TAG" "dist/redstonepanel_${CI_COMMIT_TAG#v}_all.deb"

release-from-github:
  stage: release
  image: python:3.12-slim
  interruptible: false
  resource_group: release
  needs: []
  rules:
    - if: $RELEASE_TAG && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")
  script:
    - python3 packaging/gitlab-release.py "$RELEASE_TAG"
