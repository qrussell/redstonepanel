# Lightweight checks for merge requests, main and tags.
# Having this file also turns off GitLab Auto DevOps for the project (its generic
# build/test/code_quality jobs don't apply to this repo).
# The .deb is built, install-tested and released by GitHub Actions
# (.github/workflows/release.yml) from the tags GitLab mirrors to GitHub.

workflow:
  rules:
    # Merge request pipelines, and branch pipelines only for main (no duplicates
    # when a branch has an open merge request)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.12-slim
  interruptible: true

stages:
  - check

python:
  stage: check
  script:
    - python -m py_compile main.py run.py https_redirect.py core/*.py tests/*.py
    - python -m unittest discover -s tests -v

version:
  stage: check
  script:
    # The man page must name the debian/changelog version; a tag must match it too
    - VERSION=$(head -1 debian/changelog | sed -E 's/.*\(([^)]+)\).*/\1/')
    - grep -q "\"redstonepanel $VERSION\"" packaging/redstonepanel.8 || { echo "packaging/redstonepanel.8 is not at $VERSION"; exit 1; }
    - if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then echo "tag $CI_COMMIT_TAG != v$VERSION"; exit 1; fi
    - echo "version $VERSION"

package:
  stage: check
  script:
    # Every core module must be installed by the package
    - for f in core/*.py; do grep -q "$f" debian/redstonepanel.install || { echo "$f missing from debian/redstonepanel.install"; exit 1; }; done
    # Shell scripts must parse and keep LF line endings (CRLF breaks them on Linux)
    - for f in packaging/*.sh packaging/test/*.sh deploy/*.sh packaging/redstonepanel; do bash -n "$f" || exit 1; done
    - if grep -l $'\r' packaging/*.sh packaging/test/*.sh deploy/*.sh packaging/redstonepanel debian/*; then echo "CRLF line endings found"; exit 1; fi
    - echo "package files OK"

workflows:
  stage: check
  script:
    # GitHub Actions workflows must be valid YAML with jobs
    - pip install --quiet --disable-pip-version-check pyyaml
    - |
      python - <<'EOF'
      import glob, yaml
      for path in sorted(glob.glob(".github/workflows/*.yml")):
          data = yaml.safe_load(open(path, encoding="utf-8"))
          assert isinstance(data, dict) and data.get("jobs"), f"{path}: no jobs"
          print(f"ok {path}: {', '.join(data['jobs'])}")
      EOF
