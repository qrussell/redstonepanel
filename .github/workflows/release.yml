# Builds the .deb, runs the install tests on Ubuntu 24.04, 26.04 and 26.10 and Debian 13 (x86-64),
# and on Ubuntu 26.04 and Debian 13 on ARM64 (GitHub's ARM runners: a Raspberry Pi's
# architecture), runs the multi-container cluster tests (cluster, move, backup copies), and on
# version tags (e.g. v1.0.0) attaches the .deb to a GitHub Release whose description is
# release-notes/<tag>.md (GitHub's generated notes if that file is missing).
# Runs on every push to main (GitLab mirrors it here after each merge), so a broken install on
# any supported system shows up at merge time instead of at release time; on tags; and by hand.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(head -1 debian/changelog | sed -E 's/.*\(([^)]+)\).*/\1/')
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $version"; exit 1; }
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build .deb in ubuntu:24.04
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" ubuntu:24.04 bash /src/packaging/build-deb.sh | tee build.log
          # lintian runs inside the build; fail on errors or warnings
          if grep -E '^[EW]: ' build.log; then echo "::error::lintian reported problems"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu]
        release: ['24.04', '26.04', '26.10']
        flags: ['', '--no-install-recommends']
        runner: [ubuntu-latest]
        include:
          - {distro: debian, release: '13', flags: '', runner: ubuntu-latest}
          - {distro: debian, release: '13', flags: '--no-install-recommends', runner: ubuntu-latest}
          # ARM64 (Raspberry Pi 4/5, ARM servers): Java servers only, Bedrock refused
          - {distro: ubuntu, release: '26.04', flags: '', runner: ubuntu-24.04-arm}
          - {distro: debian, release: '13', flags: '', runner: ubuntu-24.04-arm}
    name: test ${{ matrix.distro }} ${{ matrix.release }} ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }} ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Start systemd container
        run: |
          docker build -q --build-arg DISTRO=${{ matrix.distro }} --build-arg REL=${{ matrix.release }} \
            -t rp-systemd:test packaging/test
          docker run -d --privileged \
            --name rp-test -v "$PWD/dist:/dist:ro" -v "$PWD/packaging/test:/t:ro" rp-systemd:test
          for _ in $(seq 1 30); do
            state=$(docker exec rp-test systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          echo "systemd state: $state"
      - name: Install test
        run: docker exec rp-test bash /t/test-install.sh ${{ matrix.flags }}
      - name: Service log on failure
        if: failure()
        run: docker exec rp-test journalctl -u redstonepanel --no-pager -n 200 || true

  # End-to-end tests with several panels on one Docker network (Ubuntu 24.04 containers):
  # clusters (join, node allowlist, certificate renewal, promotion), moving and copying servers,
  # 1.16.8's backup copies on another member, and 1.16.11's Bedrock firewall rules. Stand-in game servers; nothing big downloaded.
  cluster:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [test-cluster, test-cluster-phase2, test-move, test-backup-copies, test-bedrock-firewall, test-port-forwarding]
    name: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Run ${{ matrix.script }}.sh
        run: bash packaging/test/${{ matrix.script }}.sh

  release:
    needs: [test, cluster]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use release-notes/<tag>.md when present, else GitHub's generated notes
          if [ -f "release-notes/$GITHUB_REF_NAME.md" ]; then
            NOTES=(--notes-file "release-notes/$GITHUB_REF_NAME.md")
          else
            echo "::warning::No release-notes/$GITHUB_REF_NAME.md; using GitHub's generated notes."
            NOTES=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --title "RedstonePanel ${GITHUB_REF_NAME#v}" "${NOTES[@]}"
      # qrussell-repo (apt) lists this project in its sources.json and picks up new
      # releases on its own within 4 hours. With a QRUSSELL_REPO_DISPATCH_TOKEN secret
      # (fine-grained token, qrussell/qrussell-repo, Contents: read and write) it
      # publishes right away instead.
      - name: Ask qrussell-repo to publish now (optional)
        env:
          TOKEN: ${{ secrets.QRUSSELL_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No QRUSSELL_REPO_DISPATCH_TOKEN secret: qrussell-repo publishes this release within 4 hours."
            exit 0
          fi
          curl -fsS -X POST https://api.github.com/repos/qrussell/qrussell-repo/dispatches \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"tag\":\"$GITHUB_REF_NAME\"}}" \
            && echo "qrussell-repo publish started." \
            || echo "::warning::Could not start qrussell-repo's publish; it will pick the release up within 4 hours."
